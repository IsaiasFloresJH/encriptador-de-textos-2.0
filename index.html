<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Encriptador de mensajes</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,100&family=Roboto+Mono:ital,wght@0,300;1,200&family=Rowdies:wght@700&family=Rubik+Bubbles&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="img/Logo.png">
  </head>
  <body>
    <section>
      <div class="inti glass">
        <div class="Vector">
          <img class="logoImg" src="img/Logo.png">
          <h1 class="tittle">Encriptador de Mensajes <span class="tech">2.0</span></h1>
        </div>
        <div class="main-content">
          <div class="left">
            <label for="inputtexto" class="label-input">Texto a procesar:</label>
            <textarea class="text-input" name="input-texto" id="inputtexto" placeholder="Coloca el texto que deseas encriptar o desencriptar..."></textarea>
            <div class="options">
              <label for="algoritmo">Algoritmo:</label>
              <select id="algoritmo">
                <option value="basico">Básico</option>
                <option value="reversa">Reversa</option>
                <option value="base64">Base64</option>
                <option value="cesar">César (+3)</option>
                <option value="rot13">ROT13</option>
                <option value="binario">Binario</option>
              </select>
              <button type="button" class="btn-limpiar" onclick="limpiar()">Limpiar</button>
            </div>
            <div class="left-button">
              <p class="parrafo">Sólo letras minúsculas y sin acento</p>
              <button type="button" class="btn-encriptar" onclick="encriptar()">Encriptar</button>
              <button type="button" class="btn-desencriptar" onclick="desencriptar()">Desencriptar</button>
            </div>
          </div>
          <div class="right">
            <img src="img/Muñeco.png" id="imgDer">
            <h1 id="texto" class="mensaje-info">Ningún mensaje fue encontrado</h1>
            <div class="texto3">
              <textarea id="texto2" readonly></textarea>
            </div>
            <div class="acciones">
              <button type="button" id="copiar" onclick="copia()"><span class="icon">📋</span> Copiar</button>
              <button type="button" id="descargar" onclick="descargar()"><span class="icon">⬇️</span> Descargar</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
